# Release pipeline: a v* tag turns into a published GitHub Release carrying
# Momito-v<version>.dmg and .zip, built unattended by scripts/make_release.sh
# (bundle) and scripts/make_dmg.sh (packaging). Three triggers share one
# build path:
#
#   - push of a v* tag      the real thing — build, then publish the release
#   - workflow_dispatch     dry run — full build, nothing published; exists so
#                           any branch can rehearse the pipeline
#   - pull_request          dry run on release-relevant changes — catches
#                           packager breakage in review
#
# Notarization ships dormant (launch spec, locked decision): when the Apple
# Developer secrets below all exist, tag builds sign with Developer ID and
# notarize; until then builds stay ad-hoc signed and unsigned. Adding the
# secrets changes nothing else in the pipeline.
#
#   APPLE_CERTIFICATE_P12           base64-encoded Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD      .p12 passphrase
#   APPLE_ID                        notarytool Apple ID
#   APPLE_APP_SPECIFIC_PASSWORD     notarytool app-specific password
#   APPLE_TEAM_ID                   notarytool team id

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "VERSION"
      - "requirements.txt"
      - "installer/Info.plist.in"
      - "scripts/make_release.sh"
      - "scripts/make_dmg.sh"
      - "scripts/validate_bundle.sh"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple silicon: MLX and the pyobjc bridge do not exist anywhere else,
    # and neither does Momito.
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      # Publishing the release (tag builds only) needs contents: write.
      contents: write

    env:
      # Dry run everywhere except a real tag push: workflow_dispatch and
      # pull_request rehearse the build and stop before publishing.
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Same interpreter tests.yml pins: every pinned dependency ships an
          # arm64 wheel for it, and its shared library is what the bundle
          # embeds (scripts/make_release.sh dlopens it).
          python-version: "3.14"

      - name: Read the version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches VERSION
        if: env.PUBLISH == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION (v$VERSION)." >&2
            exit 1
          fi

      - name: Build the self-contained bundle
        run: ./scripts/make_release.sh dist

      - name: Detect the signing secrets
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ] && \
             [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Signing secrets absent — the build stays ad-hoc signed and unsigned."
          fi

      # ---- Dormant notarization path: tag builds with Apple secrets ----

      - name: Import the Developer ID certificate
        if: env.PUBLISH == 'true' && env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/dev-id.p12"
          KEYCHAIN="$RUNNER_TEMP/release.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          base64 -d <<<"$CERT_P12" > "$CERT" || base64 -D <<<"$CERT_P12" > "$CERT"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

      - name: Sign the bundle with Developer ID
        if: env.PUBLISH == 'true' && env.HAS_SIGNING == 'true'
        run: |
          # Not --deep: re-sign every Mach-O explicitly (the packager already
          # ad-hoc re-signed the dylibs it rewrote), then the bundle itself.
          # dSYM debug bundles hold Mach-O DWARF files that are never loaded
          # at runtime — skip them.
          find dist/Momito.app -type f \( -name '*.dylib' -o -name '*.so' \) \
            ! -path '*.dSYM/*' \
            -exec codesign --force --options runtime --timestamp \
                            --keychain "$KEYCHAIN" \
                            --sign "Developer ID Application" {} +
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" \
            --sign "Developer ID Application" dist/Momito.app
          codesign --verify --strict dist/Momito.app

      - name: Assemble the DMG and zip
        run: ./scripts/make_dmg.sh dist/Momito.app

      - name: Notarize and staple the DMG
        if: env.PUBLISH == 'true' && env.HAS_SIGNING == 'true'
        env:
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="dist/Momito-v${VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_ID" --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # ------------------------------------------------------------------

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Momito-v${{ env.VERSION }}.dmg
            dist/Momito-v${{ env.VERSION }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload the dry-run build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Momito-v${{ env.VERSION }}-unsigned
          path: |
            dist/Momito-v${{ env.VERSION }}.dmg
            dist/Momito-v${{ env.VERSION }}.zip
          retention-days: 7
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          if [ "$PUBLISH" = "true" ]; then
            MODE="publish — tag ${GITHUB_REF_NAME}"
          else
            MODE="dry run — built and validated, nothing published"
          fi
          {
            echo "### release — Momito v${VERSION:-?}"
            echo
            echo "- mode: $MODE"
            echo "- artifacts:"
            ls -lh dist 2>/dev/null || echo "  (dist missing — an earlier step failed)"
          } >> "$GITHUB_STEP_SUMMARY"
